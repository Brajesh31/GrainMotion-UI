<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="GrainMotion-UI Phase 4 Hourglass Timer live demo"><title>GrainMotion-UI Hourglass Timer</title><style>
:root{color-scheme:light;--page:#e9e4da;--card:#f1ede5;--ink:#2b2a27;--mute:#7c766b;--line:#d6cec0}*{box-sizing:border-box}html{background:var(--page);color:var(--ink);font:15px/1.5 system-ui,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(640px,100%);padding:32px 24px;background:var(--card);border:1px solid var(--line);border-radius:24px;text-align:center}h1{margin:0;font-size:clamp(26px,5vw,36px)}.lede,.hint{color:var(--mute)}.stage{display:grid;justify-items:center;gap:14px;margin:28px auto;min-height:100px}.stage>sand-progress,.stage>sand-progress-ring,.stage>sand-steps,.stage>sand-loader{width:100%;max-width:480px}.stage>sand-progress-ring{max-width:220px}.stage>sand-timer{width:min(300px,100%)}button{border:1px solid var(--line);border-radius:99px;padding:7px 14px;background:transparent;color:inherit;font:inherit;cursor:pointer}.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}a{color:inherit}:focus-visible{outline:2px solid #3a3027;outline-offset:3px}</style></head><body><main><h1>Hourglass Timer</h1><p class="lede">A countdown timer rendered as a two-chamber hourglass. Sand falls through a narrow waist; pause, resume, reset and cancel controls remain native buttons.</p><div class="stage"><sand-timer id="el" duration="30" label="Short timer"></sand-timer><p id="readout">30 seconds</p><div class="actions"><button id="start">Start</button><button id="pause">Pause / Resume</button><button id="reset">Reset</button><button id="cancel">Cancel</button></div></div><p class="hint">Sand falls between two chambers to show remaining time.</p><div class="hint"><a href="../gallery/">Back to gallery</a> · <a href="README.md">Documentation</a></div></main><script src="timer.js"></script><script>const el=document.getElementById('el'),out=document.getElementById('readout');el.addEventListener('timer-tick',e=>out.textContent=e.detail.remaining+' seconds');el.addEventListener('complete',()=>out.textContent='Complete');document.getElementById('start').onclick=()=>el.start();document.getElementById('pause').onclick=()=>el.pause();document.getElementById('reset').onclick=()=>el.reset();document.getElementById('cancel').onclick=()=>{el.cancel();out.textContent='Cancelled'};</script></body></html>
