<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Combobox / Autocomplete concept study</title><desc id="desc">A thin bamboo rake follows the characters as the user types. Suggestions come from a real browser datalist connected to a native text input.</desc>
