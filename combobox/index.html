<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="GrainMotion-UI Combobox / Autocomplete live demo">
<title>GrainMotion-UI Combobox / Autocomplete</title>
<style>
:root{--page:#e9e4da;--card:#f1ede5;--ink:#2b2a27;--mute:#7c766b;--line:#d6cec0}
*{box-sizing:border-box}
html{background:var(--page);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(620px,100%);padding:34px 28px 30px;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 2px 12px #34271912}
h1{text-align:center;margin:0;font-size:clamp(26px,5vw,36px);letter-spacing:-.03em}
.lede{text-align:center;margin:8px auto 0;max-width:500px;color:var(--mute)}
.stage{display:grid;justify-items:center;gap:14px;margin:30px auto 18px;max-width:520px}
.stage>sand-combobox{width:100%}
.readout{margin:10px 0 0;text-align:center;color:#5f4b37;font-variant-numeric:tabular-nums}
.hint{text-align:center;font-size:13px;color:var(--mute);margin:18px 0 0}
.mini{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.pill{font:inherit;padding:7px 15px;border-radius:99px;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #382f26;outline-offset:4px}
a{color:inherit}
@media(max-width:480px){main{padding:25px 14px;border-radius:20px}}
</style>
</head>
<body>
<main>
<h1>Combobox / Autocomplete</h1>
<p class="lede">A thin bamboo rake follows the characters as the user types. Suggestions come from a real browser datalist connected to a native text input.</p>
<div class="stage">
<sand-combobox id="el" name="city" label="City" options="DEL:Delhi,BLR:Bengaluru,HYD:Hyderabad,PNQ:Pune" placeholder="Start typing a city"></sand-combobox>
<p class="readout" id="readout">Type a city or enter your own value</p>
</div>
<p class="hint"><a href="../gallery/">Back to component gallery</a> · <a href="README.md">Read full documentation</a></p>
</main>
<script src="combobox.js"></script>
<script>
const el = document.getElementById('el');
const readout = document.getElementById('readout');
el.addEventListener('input', () => { readout.textContent = el.value ? 'Query: ' + el.value : 'Type a city or enter your own value'; });
el.addEventListener('option-selected', event => { readout.textContent = 'Suggestion selected: ' + event.detail.label; });
</script>
</body>
</html>
