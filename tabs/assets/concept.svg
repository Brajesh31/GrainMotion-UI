<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Tabs: river stone moving between carved wells</title><desc id="desc">An ivory tactile tab tray. A flat grey stone rests on the active Overview tab above a real content panel.</desc><defs><linearGradient id="sand" x2="0" y2="1"><stop stop-color="#f8f1e5"/><stop offset="1" stop-color="#dfcdb1"/></linearGradient><linearGradient id="stone" x2="0" y2="1"><stop stop-color="#c0c4bf"/><stop offset="1" stop-color="#414745"/></linearGradient></defs><rect width="1280" height="720" fill="url(#sand)"/><text x="90" y="105" font-family="Georgia" font-size="44" fill="#493522">01 / Tabs</text><text x="90" y="145" font-family="Arial" font-size="20" fill="#76634d">A flat river stone settles in the active tab groove.</text><rect x="120" y="210" width="1040" height="400" rx="34" fill="#513722"/><rect x="135" y="225" width="1010" height="370" rx="25" fill="#f1e3cb"/><g font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle"><rect x="165" y="245" width="290" height="92" rx="18" fill="url(#stone)"/><rect x="485" y="245" width="290" height="92" rx="18" fill="#ead9bc"/><rect x="805" y="245" width="290" height="92" rx="18" fill="#ead9bc"/><text x="310" y="300" fill="#fff6e8">Overview</text><text x="630" y="300" fill="#695338">Activity</text><text x="950" y="300" fill="#695338">Settings</text></g><rect x="165" y="365" width="930" height="195" rx="20" fill="#e7d6b8" stroke="#bda27b" stroke-width="2"/><path d="M215 420 Q400 407 590 420 M215 450 Q400 438 590 450 M215 480 Q400 468 590 480" stroke="#bd9c6b" stroke-width="3" fill="none" opacity=".65"/><text x="215" y="530" font-family="Arial" font-size="24" fill="#59452d">Real panel content sits above the sand surface</text></svg>