<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="GrainMotion-UI Tabs tactile component demo"><title>GrainMotion-UI Tabs</title><style>
:root{--page:#e9e4da;--card:#f1ede5;--ink:#2b2a27;--mute:#7c766b}*{box-sizing:border-box}html{background:var(--page);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(760px,100%);padding:34px 30px 28px;background:var(--card);border:1px solid #d6cec0;border-radius:25px;box-shadow:0 3px 16px #34271916}h1{text-align:center;margin:0;font-size:clamp(26px,5vw,36px)}.lede{max-width:600px;margin:7px auto 0;color:var(--mute);text-align:center}.stage{max-width:620px;margin:28px auto 16px;padding:16px 12px 12px;border-radius:18px;background:linear-gradient(145deg,#e7dcc8,#d9c8ad);box-shadow:inset 0 2px 6px #80664425,0 1px #fff}.stage>sand-tabs,.stage>sand-accordion,.stage>sand-breadcrumbs{width:100%}.stage>sand-pagination{width:100%;max-width:520px}.stage>sand-menu{width:100%;max-width:480px}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:15px auto}.controls button{font:inherit;font-size:13px;padding:7px 13px;border:1px solid #c6b9a6;border-radius:99px;background:#f3eee5;color:#493b2b;cursor:pointer}.controls button:hover{background:#fff8ec}.readout{text-align:center;color:#6c563e;font-size:13px;margin:10px 0 0;min-height:22px}.foot{text-align:center;margin-top:24px;color:var(--mute);font-size:13px}.foot a{color:inherit}button:focus-visible,a:focus-visible{outline:2px solid #352719;outline-offset:3px}@media(max-width:520px){body{padding:12px}main{padding:25px 12px 20px;border-radius:19px}.stage{padding:8px 4px}.controls{gap:5px}.controls button{font-size:12px;padding:6px 10px}}
</style></head><body><main><h1>Tabs</h1><p class="lede">A moving stone marker selects a tab while its panel remains ordinary interactive content.</p><div class="stage"><sand-tabs id="el" tabs="overview:Overview,activity:Activity,settings:Settings" value="overview" label="Project sections">
<template data-panel="overview"><h3>Project overview</h3><p>Three working panels, one real selected tab. The stone marker rests inside the active carved well.</p><ul><li>Build the project</li><li>Review deployment status</li></ul></template>
<template data-panel="activity"><h3>Recent activity</h3><p>Last deployment completed. Two review notes remain open.</p><ul><li>Deployment · 10:42</li><li>Review · 09:18</li></ul></template>
<template data-panel="settings"><h3>Project settings</h3><p>Manage visibility, integrations and notification preferences.</p></template>
</sand-tabs><div class="controls"><button id="manual">Manual activation</button><button id="automatic">Automatic activation</button><button id="vertical">Vertical layout</button></div><p class="readout" id="out">Selected: overview</p></div><p class="foot"><a href="../gallery/">Back to all twenty-nine components</a> · <a href="README.md">Read component documentation</a></p></main><script src="tabs.js"></script><script>const el=document.getElementById('el'),out=document.getElementById('out');el.addEventListener('change',e=>out.textContent='Selected: '+e.detail.value);document.getElementById('manual').onclick=()=>el.setAttribute('activation','manual');document.getElementById('automatic').onclick=()=>el.setAttribute('activation','automatic');document.getElementById('vertical').onclick=()=>el.setAttribute('orientation',el.orientation==='vertical'?'horizontal':'vertical');</script></body></html>
