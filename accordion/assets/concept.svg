<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Accordion: walnut lids over sand compartments</title><desc id="desc">Three wooden lids, the first lifted to reveal a sandy content compartment.</desc><defs><linearGradient id="sand" x2="0" y2="1"><stop stop-color="#f8f1e5"/><stop offset="1" stop-color="#dfcdb1"/></linearGradient><linearGradient id="wood" x2="0" y2="1"><stop stop-color="#916d4c"/><stop offset="1" stop-color="#503621"/></linearGradient><linearGradient id="stone" x2="0" y2="1"><stop stop-color="#b9bdba"/><stop offset="1" stop-color="#414745"/></linearGradient></defs><rect width="1280" height="720" fill="url(#sand)"/><text x="90" y="105" font-family="Georgia" font-size="44" fill="#493522">02 / Accordion</text><text x="90" y="145" font-family="Arial" font-size="20" fill="#76634d">Wooden lids lift to uncover individual sand wells.</text><rect x="240" y="205" width="800" height="435" rx="30" fill="#4c3422"/><rect x="255" y="220" width="770" height="405" rx="22" fill="#e9d8bc"/><rect x="295" y="250" width="690" height="68" rx="13" fill="url(#wood)" stroke="#513722" stroke-width="2"/><ellipse cx="330" cy="284" rx="14" ry="14" fill="url(#stone)"/><text x="375" y="292" font-family="Arial" font-size="23" font-weight="bold" fill="#f8eddc">Shipping details</text><rect x="310" y="318" width="660" height="105" rx="12" fill="#f4e7d1" stroke="#c5aa81"/><path d="M350 356 Q500 343 660 356 T920 356 M350 383 Q500 370 660 383 T920 383" stroke="#c1a276" stroke-width="3" fill="none" opacity=".7"/><text x="350" y="405" font-family="Arial" font-size="20" fill="#604b32">Actual interactive HTML content</text><rect x="295" y="445" width="690" height="68" rx="13" fill="url(#wood)" stroke="#513722" stroke-width="2"/><ellipse cx="330" cy="479" rx="14" ry="14" fill="url(#stone)"/><text x="375" y="487" font-family="Arial" font-size="23" font-weight="bold" fill="#f8eddc">Returns</text><rect x="295" y="530" width="690" height="68" rx="13" fill="url(#wood)" stroke="#513722" stroke-width="2"/><ellipse cx="330" cy="564" rx="14" ry="14" fill="url(#stone)"/><text x="375" y="572" font-family="Arial" font-size="23" font-weight="bold" fill="#f8eddc">Care instructions</text></svg>