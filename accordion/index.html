<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="GrainMotion-UI Accordion tactile component demo"><title>GrainMotion-UI Accordion</title><style>
:root{--page:#e9e4da;--card:#f1ede5;--ink:#2b2a27;--mute:#7c766b}*{box-sizing:border-box}html{background:var(--page);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(760px,100%);padding:34px 30px 28px;background:var(--card);border:1px solid #d6cec0;border-radius:25px;box-shadow:0 3px 16px #34271916}h1{text-align:center;margin:0;font-size:clamp(26px,5vw,36px)}.lede{max-width:600px;margin:7px auto 0;color:var(--mute);text-align:center}.stage{max-width:620px;margin:28px auto 16px;padding:16px 12px 12px;border-radius:18px;background:linear-gradient(145deg,#e7dcc8,#d9c8ad);box-shadow:inset 0 2px 6px #80664425,0 1px #fff}.stage>sand-tabs,.stage>sand-accordion,.stage>sand-breadcrumbs{width:100%}.stage>sand-pagination{width:100%;max-width:520px}.stage>sand-menu{width:100%;max-width:480px}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:15px auto}.controls button{font:inherit;font-size:13px;padding:7px 13px;border:1px solid #c6b9a6;border-radius:99px;background:#f3eee5;color:#493b2b;cursor:pointer}.controls button:hover{background:#fff8ec}.readout{text-align:center;color:#6c563e;font-size:13px;margin:10px 0 0;min-height:22px}.foot{text-align:center;margin-top:24px;color:var(--mute);font-size:13px}.foot a{color:inherit}button:focus-visible,a:focus-visible{outline:2px solid #352719;outline-offset:3px}@media(max-width:520px){body{padding:12px}main{padding:25px 12px 20px;border-radius:19px}.stage{padding:8px 4px}.controls{gap:5px}.controls button{font-size:12px;padding:6px 10px}}
</style></head><body><main><h1>Accordion</h1><p class="lede">Wooden lids lift to expose separate sand compartments without discarding content.</p><div class="stage"><sand-accordion id="el" items="shipping:Shipping,returns:Returns,care:Care" value="shipping" label="Help topics">
<template data-panel="shipping"><p>Standard delivery takes three to five working days.</p><p>Express delivery is available for selected postcodes.</p></template><template data-panel="returns"><p>Unworn items can be returned within thirty days.</p></template><template data-panel="care"><p>Keep the item dry and store away from direct sunlight.</p></template></sand-accordion><div class="controls"><button id="multiple">Allow multiple open</button><button id="collapse">Allow all closed</button><button id="reset">Reset first section</button></div><p class="readout" id="out">Open: shipping</p></div><p class="foot"><a href="../gallery/">Back to all twenty-nine components</a> · <a href="README.md">Read component documentation</a></p></main><script src="accordion.js"></script><script>const el=document.getElementById('el'),out=document.getElementById('out');el.addEventListener('change',e=>out.textContent='Open: '+(e.detail.openItems.join(', ')||'none'));document.getElementById('multiple').onclick=()=>el.toggleAttribute('multiple');document.getElementById('collapse').onclick=()=>el.toggleAttribute('collapsible');document.getElementById('reset').onclick=()=>{el.value='shipping';out.textContent='Open: shipping';};</script></body></html>
