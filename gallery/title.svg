<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">GrainMotion-UI, tactile sand interface components</title>
<desc id="desc">A warm ivory interface showcase with Slider, Toggle, Signature, and Thinking sand controls.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8f1e5"/><stop offset="1" stop-color="#ead9bd"/></linearGradient>
 <linearGradient id="sand" x2="0" y2="1"><stop stop-color="#f8dfaa"/><stop offset=".5" stop-color="#c99555"/><stop offset="1" stop-color="#f0d29b"/></linearGradient>
 <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#6c4a31"/><stop offset=".45" stop-color="#2d2018"/><stop offset="1" stop-color="#795235"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="12"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="9"/><feColorMatrix values="1 0 0 0 .65 0 1 0 0 .48 0 0 1 0 .25 0 0 0 .12 0"/></filter>
 <pattern id="ridges" width="22" height="18" patternUnits="userSpaceOnUse"><path d="M0 5 Q11 -1 22 5 M0 13 Q11 7 22 13" fill="none" stroke="#fff0c8" stroke-width="3" opacity=".72"/><path d="M0 8 Q11 2 22 8" fill="none" stroke="#9b6d3e" stroke-width="1.4" opacity=".45"/></pattern>
 <clipPath id="clip1"><rect x="150" y="405" width="560" height="105" rx="52"/></clipPath>
 <clipPath id="clip2"><rect x="885" y="405" width="560" height="105" rx="52"/></clipPath>
 <clipPath id="clip3"><rect x="150" y="700" width="560" height="105" rx="52"/></clipPath>
 <clipPath id="clip4"><rect x="885" y="700" width="560" height="105" rx="52"/></clipPath>
</defs>
<rect width="1600" height="900" fill="#171614"/>
<rect x="35" y="28" width="1530" height="844" rx="34" fill="url(#bg)"/>
<rect x="35" y="28" width="1530" height="844" rx="34" fill="#fff" opacity=".16"/>
<text x="800" y="145" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="76" font-weight="800" fill="#211d19">GrainMotion-UI</text>
<text x="800" y="198" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" fill="#655343">Interactive interface components shaped from moving sand.</text>
<g font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600">
 <rect x="520" y="225" width="270" height="58" rx="29" fill="#382a20"/><text x="655" y="262" text-anchor="middle" fill="#fff8ed">Explore Components</text>
 <rect x="810" y="225" width="270" height="58" rx="29" fill="none" stroke="#9a7956" stroke-width="2"/><text x="945" y="262" text-anchor="middle" fill="#30251c">View Documentation</text>
</g>
<g>
 <rect x="105" y="330" width="640" height="265" rx="30" fill="#8d6b48" opacity=".2" filter="url(#shadow)"/>
 <rect x="95" y="320" width="640" height="265" rx="30" fill="#fffaf1" stroke="#ddc8a9" stroke-width="2"/>
 <rect x="840" y="320" width="665" height="265" rx="30" fill="#8d6b48" opacity=".2" filter="url(#shadow)"/>
 <rect x="830" y="320" width="675" height="265" rx="30" fill="#fffaf1" stroke="#ddc8a9" stroke-width="2"/>
 <rect x="105" y="625" width="640" height="265" rx="30" fill="#8d6b48" opacity=".2" filter="url(#shadow)"/>
 <rect x="95" y="615" width="640" height="240" rx="30" fill="#fffaf1" stroke="#ddc8a9" stroke-width="2"/>
 <rect x="840" y="625" width="665" height="265" rx="30" fill="#8d6b48" opacity=".2" filter="url(#shadow)"/>
 <rect x="830" y="615" width="675" height="240" rx="30" fill="#fffaf1" stroke="#ddc8a9" stroke-width="2"/>
</g>
<g font-family="Inter,Arial,sans-serif" fill="#29221c" font-size="34" font-weight="750">
 <text x="135" y="375">Slider</text><text x="875" y="375">Toggle</text><text x="135" y="670">Signature</text><text x="875" y="670">Thinking</text>
</g>
<!-- slider -->
<rect x="150" y="405" width="560" height="105" rx="52" fill="url(#wood)"/>
<rect x="161" y="416" width="538" height="83" rx="42" fill="url(#sand)"/>
<g clip-path="url(#clip1)"><rect x="150" y="405" width="560" height="105" fill="url(#ridges)"/><rect x="150" y="405" width="560" height="105" filter="url(#grain)"/></g>
<rect x="525" y="410" width="13" height="95" rx="6" fill="#b9823e"/><rect x="528" y="412" width="6" height="91" rx="3" fill="#f7d48d"/>
<!-- toggle -->
<rect x="885" y="405" width="560" height="105" rx="52" fill="url(#wood)"/>
<rect x="897" y="417" width="536" height="81" rx="41" fill="url(#sand)"/>
<g clip-path="url(#clip2)"><rect x="885" y="405" width="560" height="105" fill="url(#ridges)"/><rect x="885" y="405" width="560" height="105" filter="url(#grain)"/></g>
<circle cx="1080" cy="458" r="28" fill="none" stroke="#a77a43" stroke-width="7"/><path d="M1080 421v37" stroke="#a77a43" stroke-width="8" stroke-linecap="round"/>
<circle cx="1350" cy="458" r="35" fill="#27292a"/><circle cx="1340" cy="446" r="10" fill="#55585a" opacity=".7"/>
<!-- signature -->
<rect x="150" y="700" width="560" height="105" rx="52" fill="url(#wood)"/><rect x="161" y="711" width="538" height="83" rx="42" fill="url(#sand)"/>
<g clip-path="url(#clip3)"><rect x="150" y="700" width="560" height="105" fill="url(#grain)"/><path d="M215 765 Q280 730 320 758 T395 755 T475 760 T570 755" fill="none" stroke="#a16f37" stroke-width="10" opacity=".65"/><path d="M215 758 Q280 723 320 751 T395 748 T475 753 T570 748" fill="none" stroke="#f5d59b" stroke-width="5"/></g>
<path d="M590 710l54 -54" stroke="#b77b35" stroke-width="10" stroke-linecap="round"/><path d="M588 710l54 -54" stroke="#f3c77c" stroke-width="4" stroke-linecap="round"/>
<!-- thinking -->
<rect x="885" y="700" width="560" height="105" rx="52" fill="url(#wood)"/><rect x="897" y="711" width="536" height="83" rx="42" fill="url(#sand)"/>
<g clip-path="url(#clip4)"><rect x="885" y="700" width="560" height="105" fill="url(#grain)"/><path d="M915 740 Q970 715 1025 740 T1135 740 T1245 740 T1355 740 T1465 740 M915 765 Q970 740 1025 765 T1135 765 T1245 765 T1355 765 T1465 765" fill="none" stroke="#f8e2b7" stroke-width="8" opacity=".85"/><path d="M915 750 Q970 725 1025 750 T1135 750 T1245 750 T1355 750 T1465 750" fill="none" stroke="#9b6a37" stroke-width="3" opacity=".6"/></g>
<text x="800" y="845" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#88745f" letter-spacing="3">SAND • MOTION • INTERACTION</text>
</svg>