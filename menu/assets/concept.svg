<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Menu: stone trigger reveals walnut option tray</title><desc id="desc">A tactile command menu with raised stone trigger and walnut-framed action tray.</desc><defs><linearGradient id="sand" x2="0" y2="1"><stop stop-color="#f8f1e5"/><stop offset="1" stop-color="#dfcdb1"/></linearGradient><linearGradient id="wood" x2="0" y2="1"><stop stop-color="#936c49"/><stop offset="1" stop-color="#4d3521"/></linearGradient><linearGradient id="stone" x2="0" y2="1"><stop stop-color="#c0c4bf"/><stop offset="1" stop-color="#414745"/></linearGradient></defs><rect width="1280" height="720" fill="url(#sand)"/><text x="90" y="105" font-family="Georgia" font-size="44" fill="#493522">05 / Menu</text><text x="90" y="145" font-family="Arial" font-size="20" fill="#76634d">A small stone lifts and uncovers an anchored walnut tray.</text><rect x="420" y="250" width="440" height="355" rx="22" fill="#4c3422"/><rect x="435" y="265" width="410" height="325" rx="16" fill="url(#wood)"/><g font-family="Arial" font-size="23" fill="#f6ead7"><rect x="455" y="285" width="370" height="60" rx="11" fill="#a37d58"/><text x="490" y="323">New project</text><rect x="455" y="360" width="370" height="60" rx="11" fill="#7b593c"/><text x="490" y="398">Duplicate</text><rect x="455" y="435" width="370" height="60" rx="11" fill="#7b593c" opacity=".5"/><text x="490" y="473" opacity=".7">Archive (disabled)</text><rect x="455" y="510" width="370" height="60" rx="11" fill="#7b593c"/><text x="490" y="548">Move to trash</text></g><rect x="545" y="195" width="190" height="50" rx="25" fill="url(#stone)" stroke="#424846" stroke-width="3"/><text x="640" y="228" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#fff5e7">Project actions</text></svg>