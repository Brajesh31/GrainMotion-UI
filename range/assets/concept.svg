<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Range Slider concept study</title><desc id="desc">Two miniature bamboo rakes move independently through a shared tray. The area between them is cut with a denser set of grooves, making the selected interval visible as disturbed sand.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8f3e9"/><stop offset="1" stop-color="#e9e0d2"/></linearGradient><linearGradient id="sand" x2="0" y2="1"><stop stop-color="#f4e5c8"/><stop offset=".5" stop-color="#d2b183"/><stop offset="1" stop-color="#f0dfbd"/></linearGradient><radialGradient id="stone"><stop stop-color="#777a7b"/><stop offset=".7" stop-color="#45484a"/><stop offset="1" stop-color="#242627"/></radialGradient><filter id="shadow"><feGaussianBlur stdDeviation="15"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><text x="800" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#30271f">GrainMotion-UI · Range Slider</text><text x="800" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#76634f">PHYSICAL INTERACTION CONCEPT · NOT A RUNTIME SCREENSHOT</text>
<rect x="170" y="370" width="1260" height="170" rx="82" fill="#604632"/><rect x="190" y="390" width="1220" height="130" rx="62" fill="url(#sand)"/><path d="M470 455h660" stroke="#b17c43" stroke-width="17" stroke-linecap="round"/><path d="M470 435v40M1130 435v40" stroke="#795332" stroke-width="8"/><rect x="430" y="350" width="80" height="210" rx="36" fill="#d9c38c" filter="url(#shadow)"/><rect x="1090" y="350" width="80" height="210" rx="36" fill="#d9c38c" filter="url(#shadow)"/>
<text x="800" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#4f3e2e">Two bamboo rakes mark the lower and upper ends of a selected interval.</text><text x="800" y="755" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" letter-spacing="4" fill="#8a765f">SAND · WALNUT · BAMBOO · RIVER STONE</text></svg>