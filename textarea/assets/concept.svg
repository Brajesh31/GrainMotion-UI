<text x="600" y="560" text-anchor="middle" font-family="Arial" font-size="22" fill="#4f3e2e">A wider sand-writing panel uses shallow horizontal impressions and a moving stylus cue. A real native textarea keeps multiline editing, selection, copy/paste and browser keyboard behavior.</text></svg>