<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GrainMotion-UI Textarea</title><style>
:root{--page:#e9e4da;--card:#f1ede5;--ink:#2b2a27;--mute:#7c766b}
*{box-sizing:border-box}html{background:var(--page);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,sans-serif}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(620px,100%);padding:32px 24px;background:var(--card);border-radius:24px;text-align:center}
h1{margin:0;font-size:32px}.lede,.hint,.readout{color:var(--mute)}
.stage{margin:32px auto 18px;max-width:520px}.stage>sand-textarea{width:100%}
.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.pill{font:inherit;padding:7px 15px;border-radius:99px;border:1px solid #d6cec0;background:transparent;cursor:pointer}
:focus-visible{outline:2px solid #3a3027;outline-offset:4px}a{color:inherit}
</style></head><body><main><h1>Textarea</h1><p class="lede">A wider sand-writing panel uses shallow horizontal impressions and a moving stylus cue. A real native textarea keeps multiline editing, selection, copy/paste and browser keyboard behavior.</p>
<div class="stage"><sand-textarea id="el" name="message" label="Message" rows="4" placeholder="Write a message..."></sand-textarea><p class="readout" id="readout">0 characters</p></div>
<p class="hint">Try typing, paste and keyboard navigation. <a href="../gallery/">Back to gallery</a> · <a href="README.md">Docs</a></p>
</main><script src="textarea.js"></script><script>
const el=document.getElementById('el');
const readout = document.getElementById('readout');
el.addEventListener('input', () => { readout.textContent = el.value.length + ' characters'; });
</script></body></html>
