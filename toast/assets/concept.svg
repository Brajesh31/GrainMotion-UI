<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Toast notification concept</title><desc id="desc">A compact walnut notification tray with a status message, an undo action and a dismiss control, stacked above another notification.</desc><defs><linearGradient id="wood" x2="0" y2="1"><stop stop-color="#8c6744"/><stop offset="1" stop-color="#49301e"/></linearGradient><linearGradient id="sand" x2="0" y2="1"><stop stop-color="#f6eddf"/><stop offset="1" stop-color="#dfc9a8"/></linearGradient></defs><rect width="960" height="540" rx="28" fill="#eee8dd"/><rect x="545" y="75" width="330" height="116" rx="20" fill="#b49a76" opacity=".4"/><rect x="520" y="58" width="360" height="140" rx="22" fill="url(#sand)" stroke="#6f5033" stroke-width="7"/><circle cx="565" cy="108" r="21" fill="url(#wood)"/><path d="M555 108L563 116L577 98" fill="none" stroke="#fff1dd" stroke-width="4" stroke-linecap="round"/><text x="602" y="102" fill="#45301e" font-size="22" font-weight="700" font-family="system-ui">Changes saved</text><text x="602" y="132" fill="#71583f" font-size="16" font-family="system-ui">Your work is up to date.</text><rect x="602" y="151" width="82" height="28" rx="8" fill="url(#wood)"/><text x="643" y="171" text-anchor="middle" font-size="14" fill="#fff1dd" font-family="system-ui">Undo</text><text x="845" y="91" font-size="25" fill="#49301e" text-anchor="middle" font-family="system-ui">×</text><rect x="545" y="235" width="300" height="92" rx="18" fill="url(#sand)" stroke="#a88c66" stroke-width="4" opacity=".8"/><text x="695" y="274" fill="#59432c" text-anchor="middle" font-size="18" font-family="system-ui">Earlier notification</text><text x="480" y="456" fill="#58432d" text-anchor="middle" font-size="18" font-family="system-ui">Corner stacking • paused timer on hover or keyboard focus</text></svg>