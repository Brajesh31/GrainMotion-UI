<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Breadcrumbs: stepping stones through sand</title><desc id="desc">Stepping stones connect Home, Library, Components and current Breadcrumbs location.</desc><defs><linearGradient id="sand" x2="0" y2="1"><stop stop-color="#f8f1e5"/><stop offset="1" stop-color="#dfcdb1"/></linearGradient><linearGradient id="stone" x2="0" y2="1"><stop stop-color="#bfc3bd"/><stop offset="1" stop-color="#474c49"/></linearGradient></defs><rect width="1280" height="720" fill="url(#sand)"/><text x="90" y="105" font-family="Georgia" font-size="44" fill="#493522">04 / Breadcrumbs</text><text x="90" y="145" font-family="Arial" font-size="20" fill="#76634d">Stepping stones make hierarchy visible and navigable.</text><path d="M145 365 Q360 340 520 365 T900 365 T1135 365" stroke="#b99767" stroke-width="8" fill="none" opacity=".65"/><g font-family="Arial" font-size="23" font-weight="bold" text-anchor="middle"><rect x="135" y="310" width="205" height="105" rx="52" fill="#ddc8a6" stroke="#ad9166" stroke-width="3"/><rect x="405" y="310" width="205" height="105" rx="52" fill="#ddc8a6" stroke="#ad9166" stroke-width="3"/><rect x="675" y="310" width="230" height="105" rx="52" fill="#ddc8a6" stroke="#ad9166" stroke-width="3"/><rect x="970" y="300" width="230" height="125" rx="62" fill="url(#stone)" stroke="#343a38" stroke-width="3"/><text x="238" y="372" fill="#58432c">Home</text><text x="508" y="372" fill="#58432c">Library</text><text x="790" y="372" fill="#58432c">Components</text><text x="1085" y="372" fill="#fff4df">Breadcrumbs</text></g><g fill="#93764f" font-family="Arial" font-size="37"><text x="365" y="377">›</text><text x="635" y="377">›</text><text x="930" y="377">›</text></g><text x="640" y="530" text-anchor="middle" font-family="Arial" font-size="23" fill="#59452d">Ancestors are links; the final stone marks the current page.</text></svg>