<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Checkbox concept study</title><desc id="desc">A small river stone rests over a checkmark etched into a circular sand well. Checking the control lifts and rolls the stone to one side, revealing the pressed mark; unchecking returns it to cover the mark.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8f3e9"/><stop offset="1" stop-color="#e9e0d2"/></linearGradient><linearGradient id="sand" x2="0" y2="1"><stop stop-color="#f4e5c8"/><stop offset=".5" stop-color="#d2b183"/><stop offset="1" stop-color="#f0dfbd"/></linearGradient><radialGradient id="stone"><stop stop-color="#777a7b"/><stop offset=".7" stop-color="#45484a"/><stop offset="1" stop-color="#242627"/></radialGradient><filter id="shadow"><feGaussianBlur stdDeviation="15"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><text x="800" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#30271f">GrainMotion-UI · Checkbox</text><text x="800" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#76634f">PHYSICAL INTERACTION CONCEPT · NOT A RUNTIME SCREENSHOT</text>
<rect x="520" y="320" width="560" height="270" rx="125" fill="#604632"/><rect x="540" y="340" width="520" height="230" rx="110" fill="url(#sand)"/><circle cx="740" cy="455" r="88" fill="none" stroke="#a98050" stroke-width="18"/><path d="M680 455l38 40 83-88" fill="none" stroke="#775534" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="835" cy="455" rx="80" ry="72" fill="url(#stone)" filter="url(#shadow)"/>
<text x="800" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#4f3e2e">A pebble lifts away from a checkmark pressed into a round sand well.</text><text x="800" y="755" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" letter-spacing="4" fill="#8a765f">SAND · WALNUT · BAMBOO · RIVER STONE</text></svg>