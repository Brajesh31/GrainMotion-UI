<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Select / Dropdown concept study</title><desc id="desc">A river stone settles into a carved well for the chosen option. The browser-native select remains responsible for its popup, keyboard navigation and selection semantics.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8f3e9"/><stop offset="1" stop-color="#e9e0d2"/></linearGradient><linearGradient id="sand" x2="0" y2="1"><stop stop-color="#f4e5c8"/><stop offset=".5" stop-color="#d2b183"/><stop offset="1" stop-color="#f0dfbd"/></linearGradient><radialGradient id="stone"><stop stop-color="#777a7b"/><stop offset=".7" stop-color="#45484a"/><stop offset="1" stop-color="#242627"/></radialGradient></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="800" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#30271f">GrainMotion-UI · Select / Dropdown</text>
<text x="800" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#76634f">PHYSICAL INTERACTION CONCEPT · NOT A RUNTIME SCREENSHOT</text>
<rect x="220" y="335" width="1160" height="230" rx="115" fill="#604632"/><rect x="245" y="360" width="1110" height="180" rx="90" fill="url(#sand)"/><path d="M390 450h760" stroke="#a98050" stroke-width="7" stroke-linecap="round"/><ellipse cx="840" cy="450" rx="68" ry="48" fill="url(#stone)"/><path d="M1240 420l30 32 30-32" fill="none" stroke="#705335" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<text x="800" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#4f3e2e">A river stone settles into a carved well for the chosen option. The browser-native select remains responsible for its popup, keyboard navigation and selection semantics.</text>
<text x="800" y="805" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" letter-spacing="4" fill="#8a765f">SAND · WALNUT · BAMBOO · RIVER STONE</text>
</svg>