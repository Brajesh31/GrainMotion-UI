<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Tooltip concept</title><desc id="desc">A small floating information stone appears above a keyboard-focused trigger, linked by an aria description.</desc><defs><linearGradient id="sand" x2="0" y2="1"><stop stop-color="#f1e4cf"/><stop offset="1" stop-color="#d7bd96"/></linearGradient><linearGradient id="wood" x2="0" y2="1"><stop stop-color="#815c3b"/><stop offset="1" stop-color="#3e291b"/></linearGradient></defs><rect width="960" height="540" rx="28" fill="#eee8dd"/><rect x="78" y="100" width="804" height="340" rx="24" fill="url(#sand)" stroke="#b89e79" stroke-width="4"/><path d="M170 330Q270 290 370 330T570 330" fill="none" stroke="#b99c71" stroke-width="5" opacity=".6"/><rect x="380" y="284" width="210" height="74" rx="18" fill="url(#wood)"/><text x="485" y="329" fill="#f8ebd7" text-anchor="middle" font-size="23" font-family="system-ui">Save draft</text><path d="M485 282V235" stroke="#8b6846" stroke-width="3" stroke-dasharray="7 8"/><path d="M485 135L505 150L530 150L545 175L530 200L505 200L485 216L465 200L440 200L425 175L440 150L465 150Z" fill="url(#wood)"/><text x="485" y="184" fill="#fff1dd" text-anchor="middle" font-size="19" font-family="system-ui">Saves changes</text><text x="480" y="484" fill="#58432d" text-anchor="middle" font-size="18" font-family="system-ui">Trigger focus stays put • aria-describedby connects the hint</text></svg>