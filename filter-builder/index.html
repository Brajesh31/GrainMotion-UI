<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrainMotion-UI · Filter Builder</title>
<meta name="description" content="Compose filter conditions with fields, operators and AND or OR logic.">
<link rel="icon" href="data:,">
<style>
:root{color-scheme:light;--page:#e9e1d4;--ink:#322b22;--muted:#776b5a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--page);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,sans-serif;display:grid;place-items:center;padding:22px}main{width:min(600px,100%);text-align:center}h1{font-size:26px;margin:0}p{color:var(--muted)}.stage{min-height:410px;display:grid;place-items:center;padding:18px 0}.stage sand-filter-builder{width:min(560px,100%);height:360px}.readout{min-height:36px;font-size:12px;overflow-wrap:anywhere}
</style>
</head>
<body><main>
<h1>🧩 Filter Builder</h1>
<p>Define conditions, choose AND or OR and emit a structured query.</p>
<div class="stage"><sand-filter-builder id="filters"></sand-filter-builder></div>
<p id="readout" class="readout" aria-live="polite">Edit the filter conditions and apply.</p>
<p><a href="../">← All components</a> · <a href="https://github.com/Brajesh31/GrainMotion-UI/blob/main/filter-builder/README.md">Documentation</a></p>
</main>
<script src="filter-builder.js"></script>
<script>
const filters=document.getElementById('filters'),out=document.getElementById('readout');
filters.fields=[{id:'status',label:'Status',type:'select',options:['Planned','In progress','Done']},{id:'owner',label:'Owner',type:'text'},{id:'priority',label:'Priority',type:'select',options:['Low','Normal','High']}];
filters.filters=[{id:'status-filter',field:'status',operator:'is',value:'In progress'},{id:'owner-filter',field:'owner',operator:'contains',value:'Ari'}];
filters.addEventListener('apply',e=>out.textContent=JSON.stringify(e.detail.query));
</script>
</body>
</html>
