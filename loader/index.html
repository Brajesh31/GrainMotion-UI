<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="GrainMotion-UI Phase 4 Loading Indicator live demo"><title>GrainMotion-UI Loading Indicator</title><style>
:root{color-scheme:light;--page:#e9e4da;--card:#f1ede5;--ink:#2b2a27;--mute:#7c766b;--line:#d6cec0}*{box-sizing:border-box}html{background:var(--page);color:var(--ink);font:15px/1.5 system-ui,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(640px,100%);padding:32px 24px;background:var(--card);border:1px solid var(--line);border-radius:24px;text-align:center}h1{margin:0;font-size:clamp(26px,5vw,36px)}.lede,.hint{color:var(--mute)}.stage{display:grid;justify-items:center;gap:14px;margin:28px auto;min-height:100px}.stage>sand-progress,.stage>sand-progress-ring,.stage>sand-steps,.stage>sand-loader{width:100%;max-width:480px}.stage>sand-progress-ring{max-width:220px}.stage>sand-timer{width:min(300px,100%)}button{border:1px solid var(--line);border-radius:99px;padding:7px 14px;background:transparent;color:inherit;font:inherit;cursor:pointer}.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}a{color:inherit}:focus-visible{outline:2px solid #3a3027;outline-offset:3px}</style></head><body><main><h1>Loading Indicator</h1><p class="lede">An indeterminate loading indicator with a miniature rake that loops through a recognizable sand pattern, distinct from the AI Thinking state.</p><div class="stage"><sand-loader id="el" label="Loading results"></sand-loader><p id="readout">Loading results</p><div class="actions"><button id="stop">Complete loading</button><button id="start">Load again</button></div></div><p class="hint">A miniature rake loops through a changing sand pattern.</p><div class="hint"><a href="../gallery/">Back to gallery</a> · <a href="README.md">Documentation</a></div></main><script src="loader.js"></script><script>const el=document.getElementById('el'),out=document.getElementById('readout');document.getElementById('stop').onclick=()=>{el.active=false;out.textContent='Loading complete'};document.getElementById('start').onclick=()=>{el.active=true;out.textContent='Loading results'}</script></body></html>
