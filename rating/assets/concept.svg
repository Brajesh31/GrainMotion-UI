<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Rating concept study</title><desc id="desc">Five individually pressed wells hold small pebbles along a horizontal tray. Choosing a rating lifts the selected pebble into a more prominent position while the remaining stones stay settled in their wells.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8f3e9"/><stop offset="1" stop-color="#e9e0d2"/></linearGradient><linearGradient id="sand" x2="0" y2="1"><stop stop-color="#f4e5c8"/><stop offset=".5" stop-color="#d2b183"/><stop offset="1" stop-color="#f0dfbd"/></linearGradient><radialGradient id="stone"><stop stop-color="#777a7b"/><stop offset=".7" stop-color="#45484a"/><stop offset="1" stop-color="#242627"/></radialGradient><filter id="shadow"><feGaussianBlur stdDeviation="15"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><text x="800" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#30271f">GrainMotion-UI · Rating</text><text x="800" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#76634f">PHYSICAL INTERACTION CONCEPT · NOT A RUNTIME SCREENSHOT</text>
<rect x="170" y="370" width="1260" height="170" rx="82" fill="#604632"/><rect x="190" y="390" width="1220" height="130" rx="62" fill="url(#sand)"/><g fill="none" stroke="#a98050" stroke-width="8"><circle cx="390" cy="455" r="44"/><circle cx="595" cy="455" r="44"/><circle cx="800" cy="455" r="44"/><circle cx="1005" cy="455" r="44"/><circle cx="1210" cy="455" r="44"/></g><ellipse cx="390" cy="455" rx="43" ry="40" fill="url(#stone)"/><ellipse cx="595" cy="455" rx="43" ry="40" fill="url(#stone)"/><ellipse cx="800" cy="444" rx="54" ry="51" fill="url(#stone)" filter="url(#shadow)"/><ellipse cx="1005" cy="455" rx="43" ry="40" fill="url(#stone)"/><ellipse cx="1210" cy="455" rx="43" ry="40" fill="url(#stone)"/>
<text x="800" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#4f3e2e">Five river stones sit in separate sand wells; one marks the chosen rating.</text><text x="800" y="755" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" letter-spacing="4" fill="#8a765f">SAND · WALNUT · BAMBOO · RIVER STONE</text></svg>