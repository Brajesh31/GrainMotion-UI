<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Date Range Picker concept study</title><desc id="desc">Two river stones mark the beginning and end of a date interval, with a shallow line pressed between them. Two native date inputs preserve calendar popup and keyboard behavior.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8f3e9"/><stop offset="1" stop-color="#e9e0d2"/></linearGradient><linearGradient id="sand" x2="0" y2="1"><stop stop-color="#f4e5c8"/><stop offset=".5" stop-color="#d2b183"/><stop offset="1" stop-color="#f0dfbd"/></linearGradient><radialGradient id="stone"><stop stop-color="#777a7b"/><stop offset=".7" stop-color="#45484a"/><stop offset="1" stop-color="#242627"/></radialGradient></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="800" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#30271f">GrainMotion-UI · Date Range Picker</text>
<text x="800" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#76634f">PHYSICAL INTERACTION CONCEPT · NOT A RUNTIME SCREENSHOT</text>
<rect x="200" y="340" width="1200" height="220" rx="110" fill="#604632"/><rect x="225" y="365" width="1150" height="170" rx="85" fill="url(#sand)"/><path d="M420 460h760" stroke="#a98050" stroke-width="10" stroke-linecap="round"/><ellipse cx="480" cy="450" rx="58" ry="46" fill="url(#stone)"/><ellipse cx="1080" cy="450" rx="58" ry="46" fill="url(#stone)"/>
<text x="800" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#4f3e2e">Two river stones mark the beginning and end of a date interval, with a shallow line pressed between them. Two native date inputs preserve calendar popup and keyboard behavior.</text>
<text x="800" y="805" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" letter-spacing="4" fill="#8a765f">SAND · WALNUT · BAMBOO · RIVER STONE</text>
</svg>