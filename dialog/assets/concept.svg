<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Dialog and modal concept</title><desc id="desc">A centered framed surface over a dimmed page, with text, cancel and confirm buttons.</desc><defs><linearGradient id="wood" x2="0" y2="1"><stop stop-color="#805a39"/><stop offset="1" stop-color="#3c281b"/></linearGradient><linearGradient id="sand" x2="0" y2="1"><stop stop-color="#f7eddf"/><stop offset="1" stop-color="#dfc9a8"/></linearGradient></defs><rect width="960" height="540" rx="28" fill="#d5cfc5"/><path d="M0 0H960V540H0Z" fill="#2d251d" opacity=".36"/><rect x="235" y="68" width="490" height="404" rx="26" fill="url(#sand)" stroke="url(#wood)" stroke-width="12"/><text x="290" y="132" fill="#493421" font-size="27" font-weight="700" font-family="system-ui">Publish this project?</text><path d="M285 158H675" stroke="#c5ad88" stroke-width="2"/><text x="290" y="210" fill="#6c5338" font-size="18" font-family="system-ui">This makes the current draft visible.</text><text x="290" y="246" fill="#6c5338" font-size="18" font-family="system-ui">Review the details before continuing.</text><rect x="435" y="386" width="120" height="48" rx="10" fill="#f7ead7" stroke="#92724b" stroke-width="2"/><text x="495" y="416" fill="#513b27" font-size="16" text-anchor="middle" font-family="system-ui">Cancel</text><rect x="570" y="386" width="120" height="48" rx="10" fill="url(#wood)"/><text x="630" y="416" fill="#fff1dd" font-size="16" text-anchor="middle" font-family="system-ui">Publish</text><text x="480" y="510" fill="#58432d" text-anchor="middle" font-size="18" font-family="system-ui">Native dialog top layer • browser-managed focus containment</text></svg>