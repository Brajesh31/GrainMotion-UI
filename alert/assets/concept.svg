<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Alert banner concept</title><desc id="desc">A persistent sand strip with a warning marker, message, action and dismiss control.</desc><defs><linearGradient id="sand" x2="0" y2="1"><stop stop-color="#f6ead6"/><stop offset="1" stop-color="#ddc39b"/></linearGradient><linearGradient id="wood" x2="0" y2="1"><stop stop-color="#987147"/><stop offset="1" stop-color="#513722"/></linearGradient></defs><rect width="960" height="540" rx="28" fill="#eee8dd"/><rect x="84" y="170" width="792" height="190" rx="26" fill="url(#sand)" stroke="#9f8057" stroke-width="5"/><circle cx="156" cy="265" r="32" fill="url(#wood)"/><text x="156" y="278" fill="#fff0d8" font-size="39" font-weight="700" text-anchor="middle" font-family="system-ui">!</text><text x="215" y="234" fill="#4e3824" font-size="27" font-weight="700" font-family="system-ui">Storage almost full</text><text x="215" y="276" fill="#72583c" font-size="19" font-family="system-ui">Remove unused files to continue.</text><rect x="215" y="302" width="150" height="38" rx="10" fill="url(#wood)"/><text x="290" y="327" fill="#fff0dc" text-anchor="middle" font-size="16" font-family="system-ui">Review storage</text><text x="828" y="213" fill="#513722" text-anchor="middle" font-size="27" font-family="system-ui">×</text><text x="480" y="440" fill="#58432d" text-anchor="middle" font-size="18" font-family="system-ui">Persistent until dismissed • polite or assertive live region by tone</text></svg>