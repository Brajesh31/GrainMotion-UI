<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Segmented Control concept study</title><desc id="desc">A shallow, flat stone travels between sections carved into one long sand tray. The sections are separated by narrow grooves; the stone settles over the active segment like a physical selector.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8f3e9"/><stop offset="1" stop-color="#e9e0d2"/></linearGradient><linearGradient id="sand" x2="0" y2="1"><stop stop-color="#f4e5c8"/><stop offset=".5" stop-color="#d2b183"/><stop offset="1" stop-color="#f0dfbd"/></linearGradient><radialGradient id="stone"><stop stop-color="#777a7b"/><stop offset=".7" stop-color="#45484a"/><stop offset="1" stop-color="#242627"/></radialGradient><filter id="shadow"><feGaussianBlur stdDeviation="15"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><text x="800" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#30271f">GrainMotion-UI · Segmented Control</text><text x="800" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#76634f">PHYSICAL INTERACTION CONCEPT · NOT A RUNTIME SCREENSHOT</text>
<rect x="240" y="350" width="1120" height="210" rx="100" fill="#604632"/><rect x="260" y="370" width="1080" height="170" rx="82" fill="url(#sand)"/><path d="M620 378v154M980 378v154" stroke="#956f48" stroke-width="8"/><rect x="645" y="388" width="310" height="134" rx="62" fill="url(#stone)" filter="url(#shadow)"/>
<text x="800" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#4f3e2e">A flat river-stone marker glides between carved sections of a sand track.</text><text x="800" y="755" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" letter-spacing="4" fill="#8a765f">SAND · WALNUT · BAMBOO · RIVER STONE</text></svg>