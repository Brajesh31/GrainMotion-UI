<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Pagination: numbered wells along a sand track</title><desc id="desc">A horizontal channel with numbered wells and a stone marker on page four.</desc><defs><linearGradient id="sand" x2="0" y2="1"><stop stop-color="#f8f1e5"/><stop offset="1" stop-color="#dfcdb1"/></linearGradient><linearGradient id="stone" x2="0" y2="1"><stop stop-color="#bfc4bf"/><stop offset="1" stop-color="#444a48"/></linearGradient></defs><rect width="1280" height="720" fill="url(#sand)"/><text x="90" y="105" font-family="Georgia" font-size="44" fill="#493522">03 / Pagination</text><text x="90" y="145" font-family="Arial" font-size="20" fill="#76634d">A river stone marks the current page on a carved track.</text><rect x="130" y="275" width="1020" height="210" rx="105" fill="#503722"/><rect x="147" y="292" width="986" height="176" rx="88" fill="#e9d8bc"/><path d="M200 380 Q360 355 520 380 T840 380 T1080 380" fill="none" stroke="#bc9e72" stroke-width="7"/><g font-family="Arial" font-weight="bold" font-size="30" text-anchor="middle"><circle cx="240" cy="380" r="37" fill="#dfc9a7"/><circle cx="390" cy="380" r="37" fill="#dfc9a7"/><circle cx="540" cy="380" r="37" fill="#dfc9a7"/><circle cx="690" cy="380" r="37" fill="url(#stone)"/><circle cx="840" cy="380" r="37" fill="#dfc9a7"/><circle cx="990" cy="380" r="37" fill="#dfc9a7"/><g fill="#6b5339"><text x="240" y="391">1</text><text x="390" y="391">2</text><text x="540" y="391">3</text><text x="840" y="391">5</text><text x="990" y="391">6</text></g><text x="690" y="391" fill="#fff6e8">4</text></g><text x="640" y="570" text-anchor="middle" font-family="Arial" font-size="24" fill="#59452d">Previous · 1 2 3 4 5 … 24 · Next</text></svg>